name: DMF check

# Runs the Snowflake data metric function checks against DQ_DEMO.RAW and fails on a bad value.
# Results are also written to DQ_AUDIT.DMF_RESULTS.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmf-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmf-check:
    name: dmf-check
    runs-on: ubuntu-latest
    # Secrets are hidden from forks and from Dependabot runs, so skip those.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[snowflake]"
      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/snowflake_key.p8"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_file"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - name: Run data metric function checks
        run: python scripts/dmf.py check
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_key.p8"
