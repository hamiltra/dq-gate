# DQ Gate pipeline.
#   M1: lint + unit tests on pull requests and pushes to main.
#   M3: dbt-build runs source freshness and `dbt build` against Snowflake in an isolated,
#       per-pull-request schema pair that is dropped when the job ends.
#   M5: dbt-build publishes its results as JUnit (a "dbt results" check on the PR); coverage-gate
#       fails when a changed dbt model has no data tests and posts a summary comment on the PR.
# Later milestones add: ServiceNow change + deploy gate (M6).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            report.xml
            coverage.xml
          retention-days: 7

  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    # Needs no secrets: `dbt parse` builds the manifest without connecting to Snowflake, so this
    # also runs on Dependabot and fork pull requests (they only skip the comment).
    permissions:
      contents: read
      pull-requests: write # post the summary comment
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      # profiles.yml requires these to render; parse never uses them.
      SNOWFLAKE_ACCOUNT: parse-only
      SNOWFLAKE_USER: parse-only
      SNOWFLAKE_ROLE: parse-only
      SNOWFLAKE_WAREHOUSE: parse-only
      SNOWFLAKE_DATABASE: parse-only
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
      # Pull requests diff against their base; pushes to main against the previous main commit.
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the gate diffs against the base commit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            dbt/requirements.txt
            pyproject.toml
      - run: pip install -r dbt/requirements.txt -e .
      - name: dbt parse
        working-directory: dbt/dq_gate
        run: dbt parse --target ci
      - name: Coverage gate
        id: gate
        run: python scripts/coverage_gate.py --base "$BASE_SHA" --summary-out coverage-summary.md
      - name: Job summary
        if: always() && hashFiles('coverage-summary.md') != ''
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        # Dependabot and fork pull requests get a read-only token, so they cannot comment.
        if: >-
          always() && hashFiles('coverage-summary.md') != '' &&
          github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Update the gate's earlier comment instead of adding a new one on every push.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- dq-gate:coverage-gate -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@coverage-summary.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@coverage-summary.md > /dev/null
          fi

  dbt-build:
    name: dbt-build
    runs-on: ubuntu-latest
    # Secrets are hidden from forks and from Dependabot runs, so skip those
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      # One isolated schema pair per pull request (CI_PR_12_STAGING, CI_PR_12_MARTS, ...)
      DBT_SCHEMA: ${{ github.event_name == 'pull_request' && format('CI_PR_{0}', github.event.number) || 'CI_MAIN' }}
    permissions:
      contents: read
      checks: write # publish the JUnit results as a check run
    defaults:
      run:
        working-directory: dbt/dq_gate
    steps:
      - uses: actions/checkout@v7
      - name: Check secrets are present
        run: |
          missing=0
          for v in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_ROLE SNOWFLAKE_WAREHOUSE SNOWFLAKE_DATABASE; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; missing=1; }
          done
          [ -n "${{ secrets.SNOWFLAKE_PRIVATE_KEY != '' && 'yes' || '' }}" ] || { echo "::error::SNOWFLAKE_PRIVATE_KEY is empty"; missing=1; }
          exit $missing
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            dbt/requirements.txt
            pyproject.toml
      - name: Install dbt and dq-tools
        run: pip install -r ../requirements.txt -e ../..
      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/snowflake_key.p8"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_file"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - name: Source freshness
        run: dbt source freshness --target ci
      - name: dbt build
        run: dbt build --target ci
      - name: Convert dbt results to JUnit
        if: always() && hashFiles('dbt/dq_gate/target/run_results.json') != ''
        run: python ../../scripts/results_to_junit.py --run-results target/run_results.json --out target/dbt-junit.xml
      - name: Publish dbt results
        if: always() && hashFiles('dbt/dq_gate/target/dbt-junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: dbt/dq_gate/target/dbt-junit.xml
          check_name: dbt results
          include_passed: true
          detailed_summary: true
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts
          path: |
            dbt/dq_gate/target/run_results.json
            dbt/dq_gate/target/manifest.json
            dbt/dq_gate/target/dbt-junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Drop CI schemas
        if: always()
        run: dbt run-operation drop_ci_schemas --target ci
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_key.p8"
