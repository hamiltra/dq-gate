# Manually reload the synthetic RAW tables in Snowflake (Actions tab > Load RAW data > Run workflow).
# Not a required check and never runs automatically. Tick "inject_defects" only to demonstrate
# the quality gate failing: the defective rows land in the shared RAW tables until you reload clean data.
name: Load RAW data

on:
  workflow_dispatch:
    inputs:
      inject_defects:
        description: "Add known data defects (demo only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[snowflake]"
      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/snowflake_key.p8"
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key_file"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - name: Generate synthetic data
        run: |
          if [ "${{ inputs.inject_defects }}" = "true" ]; then
            python scripts/generate_data.py --inject-defects
          else
            python scripts/generate_data.py
          fi
      - name: Load RAW tables
        run: python scripts/load_raw.py
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/snowflake_key.p8"
