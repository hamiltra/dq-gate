# DQ Gate pipeline: M1 (lint + test on merge requests).
# Later milestones add stages: dbt build (M3), quality gate + reporting (M5),
# ServiceNow change + deploy gate (M6).

workflow:
  rules:
    # Run on merge requests.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch pipelines when an MR is already open.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run on the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.12-slim
  interruptible: true
  # Uncomment to pin jobs to a self-hosted runner (e.g. on your Docker Swarm):
  # tags: [homelab]
  cache:
    key:
      files:
        - pyproject.toml
    paths:
      - .cache/pip

.install_deps: &install_deps
  - pip install -e ".[dev]"

lint:
  stage: lint
  script:
    - *install_deps
    - ruff check .
    - ruff format --check .

unit-tests:
  stage: test
  script:
    - *install_deps
    - pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL\s+.*?\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
